<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="College enquiry chatbot for student questions.">
    <title>AI College Enquiry Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="college-icon" aria-hidden="true">🎓</div>
            <div>
                <h1>College Enquiry Chatbot</h1>
                <p><span class="status-dot"></span> Student assistance</p>
            </div>
        </header>

        <section class="chat-box" id="chat-box" aria-live="polite" aria-label="Chat messages">
            <div class="message bot-message">
                <strong>Assistant</strong>
                <p>Hello! Welcome to the College Enquiry Chatbot. How can I help you?</p>
                <p>You can ask about courses, admission, fees, hostel, placements,
                   departments, facilities or college location.</p>
            </div>
        </section>

        <form class="input-area" id="chat-form">
            <label class="visually-hidden" for="user-input">Type your enquiry</label>
            <input
                type="text"
                id="user-input"
                name="message"
                placeholder="Type your enquiry here..."
                autocomplete="off"
                required
            >
            <button type="submit" id="send-button">Send</button>
        </form>
        <footer class="chat-footer">College information assistant</footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
